<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket · asistente personal</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #10161d; --bubble-in: #1b242e; --bubble-out: #0e5f3f;
    --text: #e8edf2; --muted: #7d8b99; --accent: #2fd47f; --line: #1f2a35;
    --warn: #f5c04a; --bad: #ff8d80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .phone { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line); border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; height: min(780px, 92vh); box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #2fd47f, #1a8f57); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .who { flex: 1; min-width: 0; }
  .who h1 { font-size: 16px; font-weight: 700; }
  .who p { font-size: 12px; color: var(--muted); }
  .live { font-size: 10px; font-weight: 700; letter-spacing: .04em; border-radius: 999px; padding: 3px 8px; white-space: nowrap; border: 1px solid var(--muted); color: var(--muted); }
  .live .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 4px; }
  .live.testing { color: var(--warn); border-color: var(--warn); }
  .live.testing .dot { background: var(--warn); animation: pulse 1.6s infinite; }
  .live.ok { color: var(--accent); border-color: var(--accent); }
  .live.ok .dot { background: var(--accent); animation: pulse 1.6s infinite; }
  .live.fail { color: var(--bad); border-color: var(--bad); }
  .live.fail .dot { background: var(--bad); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--bubble-out); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bubble-in); border-bottom-left-radius: 4px; }
  .msg .meta { display: block; font-size: 10px; color: var(--muted); margin-top: 4px; }
  .msg .note { display: block; font-size: 10.5px; color: var(--warn); margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 5px; }
  .typing { align-self: flex-start; background: var(--bubble-in); border-radius: 16px; border-bottom-left-radius: 4px; padding: 12px 16px; display: none; }
  .typing span { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s } .typing span:nth-child(3) { animation-delay: .4s }
  @keyframes blink { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  .chips { display: flex; gap: 8px; padding: 0 16px 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; color: var(--text); background: var(--bubble-in); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input { flex: 1; background: var(--bubble-in); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 11px 16px; font-size: 14.5px; outline: none; }
  input:focus { border-color: var(--accent); }
  button.send { background: var(--accent); color: #06220f; border: 0; border-radius: 999px; width: 42px; height: 42px; font-size: 17px; cursor: pointer; font-weight: 700; }
  footer { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--muted); }
  footer button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; font-size: 10.5px; padding: 4px 10px; cursor: pointer; }
  .err { color: var(--bad); font-size: 12.5px; align-self: center; text-align: center; }
</style>
</head>
<body>
  <div class="phone">
    <header>
      <div class="avatar">🐾</div>
      <div class="who">
        <h1>Pocket</h1>
        <p>asistente personal · Medellín</p>
      </div>
      <div class="live testing" id="liveChip"><span class="dot"></span><span id="liveText">PROBANDO…</span></div>
    </header>
    <div id="chat" aria-live="polite"></div>
    <div class="typing" id="typing"><span></span><span></span><span></span></div>
    <div class="chips">
      <button class="chip" onclick="quick('Apúntame: llamar a mi mamá hoy a las 5pm')">Apúntame algo</button>
      <button class="chip" onclick="quick('Dame el brief de hoy')">Dame el brief de hoy</button>
      <button class="chip" onclick="quick('¿Qué tengo pendiente?')">¿Qué tengo pendiente?</button>
    </div>
    <form id="f" onsubmit="return send(event)">
      <input id="q" placeholder="Escríbele a Pocket…" autocomplete="off" autofocus>
      <button class="send" type="submit" aria-label="Enviar">➤</button>
    </form>
    <footer>
      <span id="statusLine">conexión: probando… · SMS simulado · sin agenda activa</span>
      <button onclick="resetChat()">reiniciar</button>
    </footer>
  </div>
<script>
  const chat = document.getElementById('chat');
  const typing = document.getElementById('typing');
  const q = document.getElementById('q');
  const liveChip = document.getElementById('liveChip');
  const liveText = document.getElementById('liveText');
  const statusLine = document.getElementById('statusLine');
  const sessionId = 's-' + Math.random().toString(36).slice(2, 9);
  const MODEL_NAME = 'abliterated-model-large-v2';

  // Connection state starts UNKNOWN — LIVE only after a real probe round-trip.
  function setConn(state, detail) {
    liveChip.className = 'live ' + state;
    if (state === 'ok') {
      liveText.textContent = 'EN VIVO · ' + MODEL_NAME + (detail ? ' · ' + detail : '');
      statusLine.textContent = 'conexión: en vivo' + (detail ? ' (' + detail + ')' : '') + ' · abliteration.ai · SMS simulado · sin agenda activa';
    } else if (state === 'testing') {
      liveText.textContent = 'PROBANDO…';
      statusLine.textContent = 'conexión: probando… · SMS simulado · sin agenda activa';
    } else if (state === 'fail') {
      liveText.textContent = 'SIN CONEXIÓN';
      statusLine.textContent = 'conexión: fallida (' + (detail || 'error') + ') · SMS simulado · sin agenda activa';
    } else {
      liveText.textContent = 'NO VERIFICADO';
      statusLine.textContent = 'conexión: no verificada (sin API key) · SMS simulado · sin agenda activa';
    }
  }
  setConn('testing');
  fetch('/api/health').then(r => r.json()).then(h => {
    if (!h.keyPresent) setConn('unverified');
  }).catch(() => {});
  fetch('/api/ping').then(r => r.json()).then(p => {
    if (p.ok) setConn('ok', (p.latencyMs/1000).toFixed(1) + 's');
    else setConn('fail', p.errorClass || 'error');
  }).catch(() => setConn('fail', 'red'));

  const now = () => new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  function add(cls, text, meta, note) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    if (note) { const n = document.createElement('span'); n.className = 'note'; n.textContent = '⚠ ' + note; d.appendChild(n); }
    if (meta) { const m = document.createElement('span'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
  }
  function quick(t) { q.value = t; send(); }
  async function send(ev) {
    if (ev) ev.preventDefault();
    const text = q.value.trim(); if (!text) return false;
    q.value = '';
    add('user', text, now());
    typing.style.display = 'block'; chat.scrollTop = chat.scrollHeight;
    try {
      const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, sessionId }) });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      const meta = (j.latencyMs ? (j.latencyMs/1000).toFixed(1) + 's' : '') + (j.model ? ' · ' + j.model : '');
      add('bot', j.reply || '(sin respuesta)', meta, j.honestyNote || null);
    } catch (e) {
      const d = document.createElement('div'); d.className = 'msg err'; d.textContent = '⚠ ' + e.message; chat.appendChild(d);
    } finally { typing.style.display = 'none'; }
    return false;
  }
  async function resetChat() {
    await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reset: true, sessionId }) });
    chat.innerHTML = '';
    add('bot', 'Conversación nueva. ¿Qué te apunto? 🐾 (pendientes quedan grabados aquí; no se envían recordatorios automáticos)', now());
  }
  add('bot', '¡Hola! Soy Pocket 🐾 Tu asistente por mensaje. Apunto pendientes y te los muestro cuando me pidas el brief. (Sin agenda activa: no te escribo solo — esto es un demo local.)', now());
</script>
</body>
</html>
