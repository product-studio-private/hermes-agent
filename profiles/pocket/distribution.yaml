name: pocket
version: 0.1.0
description: >-
  Pocket — a personal assistant you text. Spanish-first (LATAM, Medellín home
  turf), remembers pendings, delivers a morning brief, researches with web
  tools, and helps with the errands people put off. One profile per machine;
  web tools only — no terminal, no files, no wallet, no MCP in v0.1.
hermes_requires: ">=0.21.0"
author: Magna Carta Studios
license: MIT
env_requires:
  - name: POCKET_MODEL
    description: Model id served by the inference endpoint (default abliterated-model-large-v2).
    required: true
    default: "abliterated-model-large-v2"
  - name: POCKET_MODEL_BASE_URL
    description: >-
      OpenAI-compatible inference endpoint. Defaults to abliteration.ai;
      point at a stub/self-hosted endpoint for testing or a different provider.
    required: true
    default: "https://api.abliteration.ai/v1"
  - name: ABLITERATION_API_KEY
    description: >-
      API key for the inference endpoint (declared via model.key_env). Any
      non-empty value works against a no-auth stub endpoint.
    required: true
